# Codacy CLOUD PLATFORM config — read by dashboard scans.
# Also respected by the Gen-3 local CLI (codacy-analysis) via `init --remote`.
# Local config lives in .codacy/codacy.config.json (a 1:1 dashboard mirror).
---
exclude_paths:
  - "SFLW-37-HANDOFF.md"
  - ".codacy/**"
  - ".claude/**"
  - ".github/**"
  - "dist/**"
  - "coverage/**"
  - "vscode-extension/webview-dist/**"
  - "node_modules/**"
  - "assets/**"
  # Vendored third-party source (ExternalCode): MIT copy of the dead
  # react-text-annotate-blend package (SFLW-47) — graded upstream, not here.
  - "src/dashboard_frontend/src/vendor/**"
